# Install this as a separate Nginx server file. It listens only on port 8026, so the existing site
# on ports 80/443 is untouched. OpenWA itself remains private on 127.0.0.1:2785.

server {
    listen 8026;
    listen [::]:8026;
    server_name ec2-3-104-117-96.ap-southeast-2.compute.amazonaws.com 3.104.117.96;

    # Canonical trailing slash: Vite and React Router use /openwa as their public base.
    location = /openwa {
        return 301 /openwa/;
    }

    location ^~ /openwa/ {
        # The trailing slash is intentional: /openwa/api/... becomes /api/... upstream,
        # /openwa/socket.io becomes /socket.io, and /openwa/assets becomes /assets.
        proxy_pass http://127.0.0.1:2785/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # Matches OpenWA's default request body ceiling for base64 media uploads.
        client_max_body_size 25m;
    }

    # Do not expose anything else on the alternate port.
    location / {
        return 404;
    }
}
