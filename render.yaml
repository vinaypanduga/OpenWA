services:
  - type: web
    name: openwa-api
    runtime: docker
    plan: standard
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    disk:
      name: openwa-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ENGINE_TYPE
        value: baileys
      - key: AUTO_START_SESSIONS
        value: 'true'
      - key: BAILEYS_MARK_ONLINE_ON_CONNECT
        value: 'false'
      # Skip remote protocol-version discovery during session startup on Render. This is also the
      # resolver's built-in safe fallback and prevents a blocked lookup from delaying QR creation.
      - key: BAILEYS_WA_VERSION
        value: 2.3000.1045340097
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_NAME
        value: /app/data/openwa.sqlite
      - key: MAIN_DATABASE_NAME
        value: /app/data/main.sqlite
      - key: DATABASE_SYNCHRONIZE
        value: 'false'
      - key: SESSION_DATA_PATH
        value: /app/data/sessions
      - key: BAILEYS_AUTH_DIR
        value: /app/data/baileys
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /app/data/media
      # Keep the one bootstrap key on the same persistent disk as the main auth database.
      - key: BOOTSTRAP_KEY_FILE
        value: /app/data/.api-key
      # Render prompts for these secret values during Blueprint creation/update.
      - key: DASHBOARD_LOGIN_EMAIL
        sync: false
      - key: DASHBOARD_LOGIN_PASSWORD
        sync: false
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      # Render Standard has 2 GB RAM. Bound reconnect history/cache spikes and leave the other
      # gigabyte for Buffers, SQLite, TLS and the OS (none of which count toward V8's old-space cap).
      - key: BAILEYS_SESSION_STORE_MAX_ENTRIES
        value: '2000'
      - key: BAILEYS_MESSAGE_STORE_LIMIT
        value: '2000'
      - key: LID_MAPPING_CACHE_MAX
        value: '2000'
      # Each concurrent inbound download can hold its entire decoded payload in memory. A 10 MiB
      # ceiling with one active download avoids the default 4 x 50 MiB burst on a small instance.
      - key: MEDIA_DOWNLOAD_MAX_BYTES
        value: '10485760'
      - key: INBOUND_MEDIA_CONCURRENCY
        value: '1'
      # Enter the final HTTPS URL Render assigns, for example:
      # https://openwa-api-xxxx.onrender.com
      - key: BASE_URL
        sync: false
